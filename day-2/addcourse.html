<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course</title>
</head>
<body bgcolor="red">
    <center>
    <h1>Add Course</h1>
    <form>
        <table cellspacing="20">
            <tr>
                <td>Course Name:</td>
                <td>
                    <input type="text" placeholder="enter your course" required>
                </td>
            </tr>
            <tr>
                <td>Course ID:</td>
                <td>
                    <input type="text"placeholder="enter your course id" required>
                </td>
            </tr>
            <tr>
                <td>Course Type:</td>
                <td>
                    <select name="course" required>
                        <option value="c1">BCA</option>
                        <option value="c2">MCA</option>
                        <option value="c3">MBA</option>
                        <option value="c4">Mtech</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Description</td>
                <td>
                    <textarea rows="10" cols="40" placeholder="briefly describe your course" required ></textarea>
                </td>
            </tr>
            <tr>
                <td>Fees</td>
                <td>
                    <select name="fees" required>
                        <option value="50000">₹50000</option>
                        <option value="100000">₹100000</option>
                        <option value="150000">₹150000</option>
                        <option value="200000">₹200000</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Education :</td>
                <td>
                    <input type="checkbox" value="ug">UG
                    <input type="checkbox" value="pg">PG
                    <input type="checkbox" value="diploma">Diploma
                </td>
            </tr>
            <tr>
                <td>Gender :</td>
                <td>
                    <input type="radio" name="gender" value="male">male
                    <input type="radio" name="gender" value="female">female
                    <input type="radio" name="gender" value="others">others
                </td>
            </tr>
            <tr>
                <td>Email: </td>
                <td>
                    <input type="email" placeholder="enter a valid email" required>
                </td>
            </tr>
            <tr>
                <td>Password: </td>
                <td>
                    <input type="password" placeholder="enter your password" required>
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="submit" value="add course">
                    <input type="reset" value="reset">
                </td>
            </tr>
        </table>
    </form>
    </center>
</body>
</html>
