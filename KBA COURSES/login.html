<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body bgcolor="#EDBBFC">
    <center>
    <form action="./homepage.html">
    <table bgcolor="white" cellspacing="10">
        <tr>
            <td align="center"><font color="#9B09C8" size="5" face="arial"><b>Login</b></font></td>
        </tr>
        <tr>
            <td><b>Email:</b></td>
        </tr>
        <tr>
            <td>
                <input type="email" required>
            </td>
        </tr>
        <tr>
            <td>
                <b>Password:</b>
            </td>
        </tr>
        <tr>
            <td>
                <input type="password" required>
            </td>
        </tr>
        <tr>
            <td>
                <input type="submit" value="Login">
            </td>
            <td><a><font color="#E18FFA">Forgot password?</font></a></td>
        </tr>
        <tr>
            <td align="center">Don't have an account?
            <a href="./signup.html"><font color="#E18FFA">Sign up</font></a></td>
        </tr>


    </table>
    </form>
    </center>
</body>
</html>
