<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
</head>
<body bgcolor="#EDBBFC">
    <center>
    <form>
    <table bgcolor="white" cellspacing="10">
        <tr>
            <td align="center"><font color="#9B09C8" size="5" face="arial"><b>Sign up</b></font></td>
        </tr>
        <tr>
            <td><b>Name:</b></td>
        </tr>
        <tr>
            <td>
                <input type="text" required>
            </td>
        </tr>
        <tr>
            <td><b>Email:</b></td>
        </tr>
        <tr>
            <td>
                <input type="email" required>
            </td>
        </tr>
        <tr>
            <td>
                <b>Password:</b>
            </td>
        </tr>
        <tr>
            <td>
                <input type="password" required>
            </td>
        </tr>
        <tr>
            <td><b>Price</b></td>
        </tr>
        <tr>
            <td>
                <select name="price">
                    <option value="admin">admin</option>
                    <option value="employee">employee</option>
                    <option value="manager">manager</option>
                </select>
            </td>
        </tr>
        <tr>
            <td>
                <input type="submit" value="Sign Up">
            </td>
        </tr>
        <tr>
            <td align="center">Already have an account?
            <a href="./login.html"><font color="#E18FFA">Login</font></a></td>
        </tr>


    </table>
    </form>
    </center>
</body>
</html>
