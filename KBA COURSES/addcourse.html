<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course</title>
</head>
<body>
     <img src="./kbalogo.png" alt="kba logo" height="30" width="30">
    <table align="right" cellspacing="10">
        <tr>
            <td>
                <a href="./homepage.html"><b>Home</b></a>
                <a href="./"><b>Courses</b></a>
                <a href="./contactuskba.html"><b>Contact us</b></a>
                <a href="./addcourse.html"><b>Add Course</b></a>
                <a href="./login.html"><b>Logout</b></a>
            </td>
        </tr>
    </table>
    <center>
    <form>
        <table cellspacing="20" bgcolor="#E88FFA">
            <tr>
                <td>
                    <h1><font color="#CD0BF4">Add Course</font></h1>
                </td>
            </tr>
            <tr>
                <td>Course Name</td></tr>
            <tr>
                <td>
                    <input type="text" placeholder="eg. Certified Blockchain Associate" required>
                </td>
            </tr>
            <tr>
                <td>Course ID</td></tr>
            <tr>
                <td>
                    <input type="text"placeholder="eg.1" required>
                </td>
            </tr>
            <tr>
                <td>Course Type</td></tr>
            <tr>
                <td>
                    <select name="course" required>
                        <option value="c1">Self-Paced</option>
                        <option value="c2">tutor</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Description</td></tr>
            <tr>
                <td>
                    <textarea rows="10" cols="40" placeholder="briefly describe your course" required ></textarea>
                </td>
            </tr>
            <tr>
                <td>Price</td></tr>
            <tr>
                <td>
                    <select name="Price" required>
                        <option value="50000">Rs.5000</option>
                        <option value="100000">Rs.100000</option>
                        <option value="150000">Rs.150000</option>
                        <option value="200000">Rs.200000</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="submit" value="add course">
                </td>
            </tr>
        </table>
    </form>
    </center>
</body>
</html>
