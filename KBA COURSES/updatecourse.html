<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UpdateCourse</title>
</head>
<body bgcolor="#EDBBFC">
    <img src="./kbalogo.png" alt="kba logo" height="30" width="30">
    <table align="right" cellspacing="20">
        <tr>
            <td>
                <a href="./homepage.html"><b>Home</b></a>
                <a href="./learnmorekba.html"><b>Courses</b></a>
                <a href="./contactuskba.html"><b>Contact us</b></a>
                <a href="./addcourse.html"><b>Add Course</b></a>
                <a href="./login.html"><b>Logout</b></a>
            </td>
        </tr>
    </table>
    <center>
    <form>
    <table bgcolor="white" cellspacing="10">
        <tr>
            <td align="center"><font color="#9B09C8" size="5" face="arial"><h3>Update Course</h3></font></td>
        </tr>
        <tr>
            <td><b>Course Name</b></td>
            
        </tr>
        <tr>
            <td>
                <input type="text" placeholder="enter course name" required>
            </td>
        </tr>
        <tr>
            <td>
                <b>Course Type</b>
            </td>
        </tr>
        <tr>
            <td>
                <select name="course">
                    <option value="Hybrid">Hybrid</option>
                    <option value="Private">Private</option>
                    <option value="Aided">Aided</option>
                </select>
            </td>
        </tr>
        <tr>
            <td>
                <b> Description</b>
            </td>
        </tr>
        <tr>
            <td>
                <textarea rows="10" cols= "20" placeholder="describe the course" required></textarea>
            </td>
        </tr>
        <tr>
            <td>
                <b>Price</b>
            </td>
        </tr>
        <tr>
            <td>
                <select name="price">
                    <option value="15000">Rs.15000</option>
                    <option value="25000">Rs.25000</option>
                    <option value="50000">Rs.50000</option>
                    <option value="100000">Rs.100000</option>
                </select>
            </td>
        </tr>
        <tr>
            <td>
                <input type="submit" value="Update Course">
            </td>
           
        </tr>
            
        


    </table>
    </form>
    </center>
</body>
</html>
